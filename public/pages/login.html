<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Первый шаг</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="/css/style.css?v=mail-and-dialog">
</head>
<body id="top" data-page="login">
    <div class="progress"></div>
    {{header}}
    <main class="auth">
        <div class="panel reveal">
            <h1>С возвращением</h1><p class="lead">Войдите, чтобы откликаться на вакансии и получать предложения.</p>
            <form id="auth-form" data-url="/api/login">
                <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
                <label class="field"><span>Пароль</span><input type="password" name="password" required autocomplete="current-password"></label>
                <p class="alt-link" style="text-align:right;margin:-6px 0 14px"><a href="/pages/forgot.html">Забыли пароль?</a></p>
                <button class="btn primary">Войти →</button>
            </form>
            <p class="alt-link">Нет аккаунта? <a href="/pages/register.html">Зарегистрироваться</a> · <a href="/">На главную</a></p>
        </div>
    </main>
    {{footer}}
    <script defer src="/scripts/scripts.js?v=halftone4"></script>
<script defer src="/scripts/app.js?v=mail-and-dialog"></script>
</body>
</html>
