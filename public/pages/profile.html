<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль — Первый шаг</title>

    {{styles}}
</head>
<body id="top" data-page="profile">
    <div class="progress"></div>
    {{header}}
    <main class="auth">
        <div class="panel wide reveal">
            <h1>Ваш профиль</h1><p class="lead">Аккаунт: <span id="email">…</span>. Чем точнее данные, тем релевантнее предложения.</p>
            <form id="profile-form">
                <div class="two">
                    <label class="field"><span>Имя и фамилия</span><input name="full_name" required></label>
                    <label class="field"><span>Возраст</span><input type="number" name="age" min="14" max="100"></label>
                </div>
                <div class="two">
                    <label class="field"><span>Образование</span><select name="education"><option value="">Выберите</option><option>Среднее профессиональное</option><option>Бакалавриат</option><option>Специалитет</option><option>Магистратура</option><option>Аспирантура</option></select></label>
                    <label class="field"><span>Место учёбы</span><input name="university" placeholder="Университет / колледж"></label>
                </div>
                <label class="field"><span>Специальность</span><input name="specialty"></label>
                <div class="two">
                    <label class="field"><span>Город</span><input name="city"></label>
                    <label class="field"><span>Навыки (через запятую)</span><input name="skills" placeholder="Excel, Figma, английский B2"></label>
                </div>
                <label class="field"><span>О себе</span><textarea name="about" placeholder="Пара предложений о ваших целях и интересах"></textarea></label>
                <label class="field"><span>Где работали (если есть)</span><textarea name="work_history" placeholder="Компания, должность, период"></textarea></label>
                <label class="field"><span>Где хотите получить опыт</span><textarea name="desired_experience" placeholder="Направления, компании, роли"></textarea></label>
                <button class="btn primary">Сохранить профиль</button>
            </form>
            <p class="alt-link"><a href="/pages/vacancies.html">Перейти к вакансиям →</a></p>
        </div>
    </main>
    {{footer}}
    {{scripts}}
</body>
</html>
