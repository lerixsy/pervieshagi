<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Открытые вакансии и стажировки для студентов. Смотрите предложения компаний и откликайтесь на подходящие.">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="theme-color" content="#050506">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="canonical" href="{{SITE_URL}}/pages/vacancies.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Первый шаг">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="Вакансии и стажировки для студентов — Первый шаг">
    <meta property="og:description" content="Открытые вакансии и стажировки для студентов. Смотрите предложения компаний и откликайтесь на подходящие.">
    <meta property="og:url" content="{{SITE_URL}}/pages/vacancies.html">
    <meta property="og:image" content="{{SITE_URL}}/img/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>Вакансии — Первый шаг</title>

    {{styles}}
</head>
<body id="top" data-page="vacancies">
    <div class="progress"></div>
    {{header}}
    <main class="inner">
        <div class="wrap">
            <span class="eyebrow">Возможности</span><h2>Вакансии и предложения</h2>
            <div class="tabs">
                <button class="tab active" data-mode="vacancies">Вакансии</button>
                <button class="tab" data-mode="offers">Предложения мне</button>
                <button class="tab" data-mode="mine">Мои отклики</button>
            </div>
            <div class="filters" id="filters">
                <input aria-label="Поиск вакансий" type="search" id="f-q" placeholder="Поиск: должность, компания, город">
                <button type="button" class="btn filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters-extra">Фильтры <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" /></svg></button>
                <div class="filter-fields" id="filters-extra">
                    <select aria-label="Формат работы" id="f-format"><option value="">Формат</option><option>Офис</option><option>Удалённо</option><option>Гибрид</option></select>
                    <select aria-label="Направление" id="f-cat"><option value="">Направление</option>{{FILTER_DIRECTIONS}}</select>
                    <div class="chips"><button type="button" class="chip" id="f-fav">♥ Избранное</button><button type="button" class="chip" id="f-paid">₽ Оплачиваемо</button><select id="f-sort" class="chipsel" aria-label="Сортировка"><option value="match">Лучшие для вас</option><option value="new">Сначала новые</option></select></div>
                </div>
            </div>
            <p class="catalog-note" id="catalog-note">Смотрите вакансии без регистрации. Для отклика понадобится аккаунт студента.</p>
            <div class="vlist" id="list" aria-live="polite" aria-busy="true"><p class="empty">Загружаем вакансии…</p></div>
            <div class="catalog-more" id="catalog-more" hidden>
                <span id="catalog-count" role="status"></span>
                <button type="button" class="btn sm" id="vacancies-more">Показать ещё</button>
            </div>
        </div>
    </main>
    {{footer}}
    {{scripts}}
</body>
</html>
