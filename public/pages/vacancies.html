<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вакансии — Первый шаг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="vacancies">
<div class="progress"></div>
<header><div class="wrap"><nav>
  <a href="/" class="logo">Первый шаг</a>
  <div class="links"><a href="/">Главная</a><a href="/pages/partners.html">Партнёрам</a></div>
  <div class="right">
    <button class="theme" id="theme" aria-label="Сменить тему">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <a id="auth-btn" href="/pages/login.html" class="btn primary sm">Войти</a>
  </div>
</nav></div></header>
<main class="inner"><div class="wrap">
  <span class="eyebrow">Возможности</span><h2>Вакансии и предложения</h2>
  <div class="tabs">
    <button class="tab active" data-mode="vacancies">Вакансии</button>
    <button class="tab" data-mode="offers">Предложения мне</button>
    <button class="tab" data-mode="mine">Мои отклики</button>
  </div>
  <div class="filters" id="filters">
    <input type="search" id="f-q" placeholder="Поиск: должность, компания, город">
    <select id="f-format"><option value="">Формат</option><option>Офис</option><option>Удалённо</option><option>Гибрид</option></select>
    <select id="f-cat"><option value="">Направление</option><option>IT</option><option>Маркетинг</option><option>Дизайн</option><option>Финансы</option><option>Продажи</option><option>HR</option><option>Другое</option></select>
    <div class="chips"><button type="button" class="chip" id="f-fav">♥ Избранное</button><button type="button" class="chip" id="f-paid">₽ Оплачиваемо</button><select id="f-sort" class="chipsel" aria-label="Сортировка"><option value="match">Лучшие для вас</option><option value="new">Сначала новые</option></select></div>
  </div>
  <div class="vlist" id="list"></div>
</div></main>
<script src="/scripts/scripts.js"></script>
<script src="/scripts/app.js"></script>
</body>
</html>
