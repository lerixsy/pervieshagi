<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="canonical" href="{{SITE_URL}}/pages/directions.html">
    <title>Направления стажировок — Первый шаг</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="/css/style.css?v=mail-and-dialog">
</head>
<body id="top" data-page="directions">
    <div class="progress"></div>
    {{header}}
    <main class="inner info-page">
        <section id="directions">
            <div class="wrap">
                <span class="eyebrow reveal">Направления</span>
                <h1 class="reveal">Стажировки для студентов по профессиям</h1>
                <p class="lead reveal">Вакансии и стажировки публикуются по направлениям — выбирайте то, что ближе к вашей специальности.</p>
                <div class="fields direction-links reveal" style="margin-top:32px" role="group" aria-label="Вакансии по направлениям">{{DIRECTION_LINKS}}</div>
            </div>
        </section>
        {{resource_nav}}
    </main>
    {{footer}}
    <script defer src="/scripts/scripts.js?v=halftone4"></script>
<script defer src="/scripts/app.js?v=mail-and-dialog"></script>
</body>
</html>
