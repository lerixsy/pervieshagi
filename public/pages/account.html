<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аккаунт — Первый шаг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="account">
<div class="progress"></div>
<header><div class="wrap"><nav>
  <a href="/" class="logo">Первый шаг</a>
  <div class="links"><a href="/">Главная</a><a href="/pages/partners.html">Партнёрам</a></div>
  <div class="right">
    <button class="theme" id="theme" aria-label="Сменить тему">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <a id="auth-btn" href="/pages/login.html" class="btn primary sm">Войти</a>
  </div>
</nav></div></header>
<main class="inner"><div class="wrap">
  <span class="eyebrow">Личный кабинет</span><h2>Аккаунт</h2><p class="lead" id="acc-info">…</p>
  <div class="tabs"><button class="tab" data-tab="profile">Профиль</button><button class="tab" data-tab="security">Безопасность</button></div>

  <div data-pane="profile">
    <div id="student-box"><form id="profile-form" class="card form-card">
      <div class="two"><label class="field"><span>Имя и фамилия</span><input name="full_name" required></label><label class="field"><span>Возраст</span><input type="number" name="age" min="14" max="100"></label></div>
      <div class="two"><label class="field"><span>Образование</span><select name="education"><option value="">Выберите</option><option>Среднее профессиональное</option><option>Бакалавриат</option><option>Специалитет</option><option>Магистратура</option><option>Аспирантура</option></select></label><label class="field"><span>Место учёбы</span><input name="university" placeholder="Университет / колледж"></label></div>
      <label class="field"><span>Специальность</span><input name="specialty"></label>
      <div class="two"><label class="field"><span>Город</span><input name="city"></label><label class="field"><span>Навыки (через запятую)</span><input name="skills" placeholder="Excel, Figma, английский B2"></label></div>
      <label class="field"><span>О себе</span><textarea name="about" placeholder="Пара предложений о ваших целях и интересах"></textarea></label>
      <label class="field"><span>Где работали (если есть)</span><textarea name="work_history" placeholder="Компания, должность, период"></textarea></label>
      <label class="field"><span>Где хотите получить опыт</span><textarea name="desired_experience" placeholder="Направления, компании, роли"></textarea></label>
      <label class="field"><span>Портфолио и ссылки (GitHub, Behance, сайт)</span><input name="portfolio" placeholder="github.com/name, behance.net/name"></label>
      <div class="acts"><button class="btn primary">Сохранить профиль</button><a class="btn" href="/pages/resume.html#me">Резюме в PDF</a></div>
    </form></div>
    <div id="company-box"><form id="company-form" class="card form-card">
      <label class="field"><span>Название компании</span><input name="name" required></label>
      <div class="two"><label class="field"><span>Сфера</span><input name="industry" placeholder="IT, маркетинг, финансы…"></label><label class="field"><span>Город</span><input name="city"></label></div>
      <label class="field"><span>Сайт</span><input name="website" placeholder="https://"></label>
      <label class="field"><span>О компании</span><textarea name="description"></textarea></label>
      <button class="btn primary">Сохранить профиль</button>
    </form></div>
  </div>

  <div data-pane="security" hidden>
    <div class="card form-card">
      <div class="devhint" id="vstat"></div>
      <h3 style="margin-bottom:18px">Смена пароля</h3>
      <form id="pw-form">
        <label class="field"><span>Текущий пароль</span><input type="password" name="current" required autocomplete="current-password"></label>
        <div class="two">
          <label class="field"><span>Новый пароль</span><input type="password" name="next" minlength="8" required autocomplete="new-password"></label>
          <label class="field"><span>Повторите новый пароль</span><input type="password" name="again" minlength="8" required autocomplete="new-password"></label>
        </div>
        <button class="btn primary">Сменить пароль</button>
      </form>
      <p class="alt-link">После смены пароля на других устройствах нужно будет войти заново.</p>
    </div>
  </div>
</div></main>
<script src="/scripts/scripts.js"></script>
<script src="/scripts/app.js"></script>
</body>
</html>
