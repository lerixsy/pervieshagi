<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Подтверждение email — Первый шаг</title>

    {{styles}}
</head>
<body id="top" data-page="verify">
    <div class="progress"></div>
    {{header}}
    <main class="auth">
        <div class="panel reveal">
            <h1>Подтвердите email</h1><p class="lead">Введите шестизначный код из письма на <b id="vemail">…</b></p>
            <p class="lead" id="verification-status" role="status"></p>
            <form id="verify-form">
                <label class="field"><span>Код из письма</span><input class="codein" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required></label>
                <button class="btn primary">Подтвердить</button>
            </form>
            <p class="alt-link"><button type="button" class="linkbtn" id="resend">Запросить код</button></p>
            <p class="alt-link"><a href="/pages/dashboard.html">Пропустить пока</a></p>
        </div>
    </main>
    {{footer}}
    {{scripts}}
</body>
</html>
