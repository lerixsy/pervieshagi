<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Чаты — Первый шаг</title>

    {{styles}}
</head>
<body id="top" data-page="chat">
    <div class="progress"></div>
    {{header}}
    <main class="inner">
        <div class="wrap">
            <span class="eyebrow">Сообщения</span><h2>Чаты</h2>
            <div class="chat" id="chat">
                <div class="card clist" id="clist"></div>
                <div class="card thread">
                    <div class="chead"><a href="#" class="back" aria-label="Назад к чатам">←</a><div style="flex:1;min-width:0"><b id="cname2">Выберите чат</b><small id="ctitle"></small></div><button class="btn sm" id="cdel" type="button" hidden>Удалить</button></div>
                    <div class="msgs" id="msgs"><p class="empty">Выберите диалог слева</p></div>
                    <form id="msg-form" class="mform" hidden><input name="text" placeholder="Напишите сообщение…" autocomplete="off" maxlength="1000"><button class="btn primary sm">Отправить</button></form>
                </div>
            </div>
        </div>
    </main>
    {{footer}}
    {{scripts}}
</body>
</html>
