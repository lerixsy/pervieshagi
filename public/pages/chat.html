<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чаты — Первый шаг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="chat">
<div class="progress"></div>
<header><div class="wrap"><nav>
  <a href="/" class="logo">Первый шаг</a>
  <div class="links"><a href="/">Главная</a><a href="/pages/partners.html">Партнёрам</a></div>
  <div class="right">
    <button class="theme" id="theme" aria-label="Сменить тему">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <a id="auth-btn" href="/pages/login.html" class="btn primary sm">Войти</a>
  </div>
</nav></div></header>
<main class="inner"><div class="wrap">
  <span class="eyebrow">Сообщения</span><h2>Чаты</h2>
  <div class="chat" id="chat">
    <div class="card clist" id="clist"></div>
    <div class="card thread">
      <div class="chead"><a href="#" class="back" aria-label="Назад к чатам">←</a><div><b id="cname2">Выберите чат</b><small id="ctitle"></small></div></div>
      <div class="msgs" id="msgs"><p class="empty">Выберите диалог слева</p></div>
      <form id="msg-form" class="mform" hidden><input name="text" placeholder="Напишите сообщение…" autocomplete="off" maxlength="1000"><button class="btn primary sm">Отправить</button></form>
    </div>
  </div>
</div></main>
<script src="/scripts/scripts.js"></script>
<script src="/scripts/app.js"></script>
</body>
</html>
