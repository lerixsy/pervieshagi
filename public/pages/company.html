<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет партнёра — Первый шаг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="company">
<div class="progress"></div>
<header><div class="wrap"><nav>
  <a href="/" class="logo">Первый шаг</a>
  <div class="links"><a href="/">Главная</a><a href="/pages/partners.html">Партнёрам</a></div>
  <div class="right">
    <button class="theme" id="theme" aria-label="Сменить тему">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <a id="auth-btn" href="/pages/login.html" class="btn primary sm">Войти</a>
  </div>
</nav></div></header>
<main class="inner" id="company-page"><div class="wrap">
  <span class="eyebrow">Кабинет партнёра</span><h2 id="cname">Компания</h2><p class="lead" style="margin-top:6px">Данные о компании — в <a href="/pages/account.html#profile" style="text-decoration:underline">аккаунте</a>.</p>
  <div class="stats">
    <div class="card stat"><b id="s-v">0</b><small>Вакансий</small></div>
    <div class="card stat"><b id="s-r">0</b><small>Откликов от студентов</small></div>
    <div class="card stat"><b id="s-i">0</b><small>Ваших приглашений</small></div>
  </div>
  <div class="tabs">
    <button class="tab" data-tab="responses">Отклики</button><button class="tab" data-tab="vacancies">Вакансии</button>
    <button class="tab" data-tab="students">Студенты</button>
  </div>
  <div data-pane="responses">
    <div class="kanban" id="kanban"></div>
    <h4 class="subh">Ваши приглашения студентам</h4>
    <div class="vlist" id="resp"></div>
  </div>
  <div data-pane="vacancies" hidden>
    <form id="vac-form" class="card form-card" style="margin-bottom:20px">
      <label class="field"><span>Название вакансии</span><input name="title" required placeholder="Например, стажёр-аналитик"></label>
      <label class="field"><span>Описание</span><textarea name="description" placeholder="Задачи, требования, условия"></textarea></label>
      <div class="two">
        <label class="field"><span>Город</span><input name="city"></label>
        <label class="field"><span>Формат</span><select name="format"><option value="">Не указан</option><option>Офис</option><option>Удалённо</option><option>Гибрид</option></select></label>
      </div>
      <div class="two">
        <label class="field"><span>Направление</span><select name="category"><option value="">Не указано</option><option>IT</option><option>Маркетинг</option><option>Дизайн</option><option>Финансы</option><option>Продажи</option><option>HR</option><option>Другое</option></select></label>
        <label class="sw" style="align-self:end;padding-bottom:18px"><span>Оплачиваемая</span><input type="checkbox" name="paid"><i></i></label>
      </div>
      <button class="btn primary">Опубликовать</button>
    </form>
    <div class="vlist" id="vlist"></div>
  </div>
  <div data-pane="students" hidden>
    <label class="field" style="max-width:420px"><span>Предложить вакансию</span><select id="inv-vac"></select></label>
    <div class="vlist" id="studs"></div>
  </div>
</div></main>
<script src="/scripts/scripts.js"></script>
<script src="/scripts/app.js"></script>
</body>
</html>
