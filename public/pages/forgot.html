<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Восстановление пароля — Первый шаг</title>

    {{styles}}
</head>
<body id="top" data-page="forgot">
    <div class="progress"></div>
    {{header}}
    <main class="auth">
        <div class="panel reveal">
            <h1>Забыли пароль?</h1><p class="lead">Введите email — пришлём код для создания нового пароля.</p>
            <form id="f1"><label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label><button class="btn primary">Получить код</button></form>
            <form id="f2" hidden>
                <label class="field"><span>Код из письма</span><input class="codein" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code"></label>
                <label class="field"><span>Новый пароль (от 8 символов)</span><input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
                <button class="btn primary">Сохранить пароль</button>
            </form>
            <p class="alt-link"><a href="/pages/login.html">Вернуться ко входу</a></p>
        </div>
    </main>
    {{footer}}
    {{scripts}}
</body>
</html>
