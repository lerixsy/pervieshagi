<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Восстановление пароля — Первый шаг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="forgot">
<div class="progress"></div>
<header><div class="wrap"><nav>
  <a href="/" class="logo">Первый шаг</a>
  <div class="links"><a href="/">Главная</a><a href="/pages/partners.html">Партнёрам</a></div>
  <div class="right">
    <button class="theme" id="theme" aria-label="Сменить тему">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <a id="auth-btn" href="/pages/login.html" class="btn primary sm">Войти</a>
  </div>
</nav></div></header>
<main class="auth"><div class="panel reveal">
  <h1>Забыли пароль?</h1><p class="lead">Введите email — пришлём код для создания нового пароля.</p>
  <form id="f1"><label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label><button class="btn primary">Получить код</button></form>
  <form id="f2" hidden>
    <div class="devhint" id="devhint" hidden>Режим разработки: ваш код <b id="devcode"></b></div>
    <label class="field"><span>Код из письма</span><input class="codein" name="code" inputmode="numeric" maxlength="6" required autocomplete="one-time-code"></label>
    <label class="field"><span>Новый пароль (от 8 символов)</span><input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
    <button class="btn primary">Сохранить пароль</button>
  </form>
  <p class="alt-link"><a href="/pages/login.html">Вернуться ко входу</a></p>
</div></main>
<script src="/scripts/scripts.js"></script>
<script src="/scripts/app.js"></script>
</body>
</html>
