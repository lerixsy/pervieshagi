<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — Первый шаг</title>

    {{styles}}
</head>
<body id="top" data-page="register">
    <div class="progress"></div>
    {{header}}
    <main class="auth">
        <div class="panel reveal">
            <h1>Создать профиль</h1><p class="lead">Бесплатно. Это займёт минуту.</p>
            <div class="tabs" id="role-tabs" style="margin:0 0 24px"><button type="button" class="tab" data-role="student">Я студент</button><button type="button" class="tab" data-role="company">Я компания</button></div>
            <form id="auth-form" data-url="/api/register">
                <input type="hidden" name="role" value="student">
                <label class="field" id="company-name" hidden><span>Название компании</span><input name="name"></label>
                <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
                <label class="field"><span>Пароль (от 8 символов)</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
                <button class="btn primary">Зарегистрироваться →</button>
            </form>
            <p class="alt-link">Уже есть аккаунт? <a href="/pages/login.html">Войти</a> · <a href="/">На главную</a></p>
        </div>
    </main>
    {{footer}}
    {{scripts}}
</body>
</html>
