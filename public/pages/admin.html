<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Админ-панель — Первый шаг</title>

    {{styles}}
</head>
<body id="top" data-page="admin">
    <div class="progress"></div>
    {{header}}
    <main class="inner">
        <div class="wrap">
            <span class="eyebrow">Администратор</span><h2>Панель управления</h2>
            <div class="tabs">
                <button class="tab" data-tab="overview">Обзор</button><button class="tab" data-tab="users">Пользователи</button>
                <button class="tab" data-tab="vacancies">Вакансии</button><button class="tab" data-tab="enrollment">Справки студентов</button><button class="tab" data-tab="support">Поддержка</button>
            </div>
            <div data-pane="overview"><div id="aov"></div></div>
            <div data-pane="users" hidden>
                <div class="filters" style="grid-template-columns:2fr 1fr"><input type="search" id="uq" placeholder="Поиск по имени или email"><select id="urole"><option value="">Все роли</option><option value="student">Студенты</option><option value="company">Компании</option><option value="pending">Ожидают одобрения</option><option value="unverified">Не подтвердили email</option><option value="admin">Админы</option></select></div>
                <div class="vlist" id="ulist"></div>
            </div>
            <div data-pane="vacancies" hidden><div class="vlist" id="avlist"></div></div>
            <div data-pane="enrollment" hidden><div class="vlist" id="enrollment-list"></div></div>
            <div data-pane="support" hidden>
                <div class="chat" id="achat" style="margin-top:0">
                    <div class="card clist" id="alist"></div>
                    <div class="card thread">
                        <div class="chead"><a href="#support" class="back" id="aback">←</a><div style="flex:1"><b id="aname">Выберите обращение</b><small id="amail"></small></div><button class="btn sm" id="astatus" hidden>Закрыть</button><button class="btn sm" id="adel" type="button" hidden>Удалить</button></div>
                        <div id="acomp" class="acomp" hidden></div>
                        <div class="msgs" id="amsgs"><p class="empty">Выберите обращение слева</p></div>
                        <form id="aform" class="mform" hidden><input name="text" placeholder="Ответ пользователю…" autocomplete="off" maxlength="1000"><button class="btn primary sm">Отправить</button></form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    {{footer}}
    {{scripts}}
</body>
</html>
