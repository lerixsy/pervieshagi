<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Админ-панель — Первый шаг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin">
<div class="progress"></div>
<header><div class="wrap"><nav>
  <a href="/" class="logo">Первый шаг</a>
  <div class="links"><a href="/">Главная</a><a href="/pages/partners.html">Партнёрам</a></div>
  <div class="right">
    <button class="theme" id="theme" aria-label="Сменить тему">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <a id="auth-btn" href="/pages/login.html" class="btn primary sm">Войти</a>
  </div>
</nav></div></header>
<main class="inner"><div class="wrap">
  <span class="eyebrow">Администратор</span><h2>Панель управления</h2>
  <div class="tabs">
    <button class="tab" data-tab="overview">Обзор</button><button class="tab" data-tab="users">Пользователи</button>
    <button class="tab" data-tab="vacancies">Вакансии</button><button class="tab" data-tab="support">Поддержка</button>
  </div>
  <div data-pane="overview"><div id="aov"></div></div>
  <div data-pane="users" hidden>
    <div class="filters" style="grid-template-columns:2fr 1fr"><input type="search" id="uq" placeholder="Поиск по имени или email"><select id="urole"><option value="">Все роли</option><option value="student">Студенты</option><option value="company">Компании</option><option value="pending">Ожидают одобрения</option><option value="admin">Админы</option></select></div>
    <div class="vlist" id="ulist"></div>
  </div>
  <div data-pane="vacancies" hidden><div class="vlist" id="avlist"></div></div>
  <div data-pane="support" hidden>
    <div class="chat" id="achat" style="margin-top:0">
      <div class="card clist" id="alist"></div>
      <div class="card thread">
        <div class="chead"><a href="#support" class="back" id="aback">←</a><div style="flex:1"><b id="aname">Выберите обращение</b><small id="amail"></small></div><button class="btn sm" id="astatus" hidden>Закрыть</button></div>
        <div id="acomp" class="acomp" hidden></div>
        <div class="msgs" id="amsgs"><p class="empty">Выберите обращение слева</p></div>
        <form id="aform" class="mform" hidden><input name="text" placeholder="Ответ пользователю…" autocomplete="off" maxlength="1000"><button class="btn primary sm">Отправить</button></form>
      </div>
    </div>
  </div>
</div></main>
<script src="/scripts/scripts.js"></script>
<script src="/scripts/app.js"></script>
</body>
</html>
